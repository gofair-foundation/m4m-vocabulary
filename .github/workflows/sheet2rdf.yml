# This is a basic workflow to help you get started with Actions
name: Sheet2RDF
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  sheet2rdf:
    # The type of runner that the job will run on

    name: Sheet2RDF
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.8"
      - name: Prepare
        shell: bash -l {0}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          conda create -n sheet2rdf python=3.8 pandas openpyxl requests
          conda activate sheet2rdf
          curl -L https://github.com/sparna-git/xls2rdf/releases/download/2.1.1/xls2rdf-app-2.1.1-onejar.jar -o xls2rdf.jar

      - name: Fetch
        shell: bash -l {0}
        env:
          FILE_NAME: 'vocabulary_test'
          SHEET_ID: '1phaIN6ED9WbXZz4ujVGwXu0s08iHWd8_CBACaCefW8c'
        run: |
          conda activate sheet2rdf          
          python ./src/sheet2xls.py

      - name: conversion-xls2rdf
        env:
          FILE_NAME: 'vocabulary_test'
        run: |
          java -jar xls2rdf.jar convert -i ${FILE_NAME}.xlsx -o ${FILE_NAME}.ttl -l en
          mv xls2rdf.log ./logs/
          python ./src/update.py

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download SKOS Play CLI and render HTML
        if: github.event_name == 'pull_request'
        env:
          FILE_NAME: 'vocabulary_test'
        run: |
          curl -L -o skos-play-cli.jar https://bitbucket.org/tfrancart/sparna/downloads/skos-play-cli-0.7.2-onejar.jar
          java -jar skos-play-cli.jar hierarchical -i ${FILE_NAME}.ttl -o ${FILE_NAME}.html -f html -l en

      - name: List files
        run: |
          ls -la

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        env:
          FILE_NAME: 'vocabulary_test'
        uses: actions/upload-artifact@v4
        with:
          name: skosplay-preview
          path: ${{ env.FILE_NAME }}.html

      - name: deploy
        if: github.event_name == 'push'
        env:
          FILE_NAME: ${{secrets.FILE_NAME}}
          GRAPH: ${{secrets.GRAPH}}
          DB_PASS: ${{secrets.DB_PASS}}
          DB_USER: ${{secrets.DB_USER}}
          SPARQL_ENDPOINT: ${{secrets.SPARQL_ENDPOINT}}
        run: |
          ./src/deploy2db.sh

